name: Release SUBaka Desktop (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Download FFmpeg sidecar (Windows x64)
        shell: bash
        run: |
          chmod +x src-tauri/binaries/download_ffmpeg_sidecars.sh || true
          bash src-tauri/binaries/download_ffmpeg_sidecars.sh "x86_64-pc-windows-msvc"

      - name: Prepare Resources folder for Desktop Bundle
        shell: bash
        run: |
          mkdir -p src-tauri/resources
          # Copy any existing databases or assets if available
          if [ -f "grammardb.sqlite3" ]; then cp grammardb.sqlite3 src-tauri/resources/; fi
          if [ -f "verbum_offline.sqlite3" ]; then cp verbum_offline.sqlite3 src-tauri/resources/; fi

      - name: Build Desktop Application with Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'SUBaka v__VERSION__ (Windows x64)'
          releaseBody: |
            ## Рэліз SUBaka для Windows x64

            ### Рэлізныя файлы для спампоўкі:
            - **windows-x64-nsis** (`SUBaka_1.0.0_x64-setup.exe`) — **Галоўны ўсталёўшчык для Windows** (рэкамендаваны для ўсіх карыстальнікаў).
            - **windows-x64-msi** (`SUBaka_1.0.0_x64_en-US.msi`) — Сістэмны MSI-пакет (для карпаратыўнага разгортвання).

            *Пры першым запуску слоўнікі і граматычная база аўтаматычна разгортваюцца ў папку `resources`.*
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subaka-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/
          if-no-files-found: ignore
