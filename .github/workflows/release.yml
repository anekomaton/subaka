name: Release SUBaka Desktop (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Download FFmpeg sidecar (Windows x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $target = "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"
          $url = "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64"
          if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 5000000) {
            Write-Host "Downloading FFmpeg sidecar from $url..."
            curl.exe -f -L --retry 3 $url -o $target
          }
          $item = Get-Item $target
          Write-Host "FFmpeg sidecar ready: $($item.FullName) ($($item.Length) bytes)"
          # Also place fallback ffmpeg.exe
          Copy-Item $target "src-tauri/binaries/ffmpeg.exe" -Force

      - name: Build Frontend for Desktop
        run: npm run build:client

      - name: Prepare Resources folder for Desktop Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources
          Set-Content -Path src-tauri/resources/.gitkeep -Value "# keep"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          
          # Build Verbum offline SQLite database if possible
          Write-Host "Building Verbum offline dictionary SQLite database..."
          try {
            python scripts/build-verbum-db.py src-tauri/resources/verbum_offline.sqlite3
          } catch {
            Write-Warning "Verbum DB build note: $_"
          }
          $global:LASTEXITCODE = 0
          
          # Build GrammarDB SQLite database from official release
          Write-Host "Building GrammarDB SQLite database from official release..."
          try {
            python server/buildGrammarDbFromRelease.py src-tauri/resources/grammardb.sqlite3
          } catch {
            Write-Warning "GrammarDB build note: $_"
          }
          $global:LASTEXITCODE = 0
          
          # If complete, rename .tmp to .sqlite3; if incomplete/corrupted (< 10MB), delete stub
          if (Test-Path "src-tauri/resources/grammardb.sqlite3.tmp") {
            $tmpSize = (Get-Item "src-tauri/resources/grammardb.sqlite3.tmp").Length
            if ($tmpSize -gt 50000000) {
              Move-Item -Force "src-tauri/resources/grammardb.sqlite3.tmp" "src-tauri/resources/grammardb.sqlite3" -ErrorAction SilentlyContinue
            } else {
              Remove-Item -Force "src-tauri/resources/grammardb.sqlite3.tmp" -ErrorAction SilentlyContinue
            }
          }
          if (Test-Path "src-tauri/resources/verbum_offline.sqlite3.tmp") {
            $tmpSize = (Get-Item "src-tauri/resources/verbum_offline.sqlite3.tmp").Length
            if ($tmpSize -gt 10000000) {
              Move-Item -Force "src-tauri/resources/verbum_offline.sqlite3.tmp" "src-tauri/resources/verbum_offline.sqlite3" -ErrorAction SilentlyContinue
            } else {
              Remove-Item -Force "src-tauri/resources/verbum_offline.sqlite3.tmp" -ErrorAction SilentlyContinue
            }
          }
          
          # Fallback check from root
          if ((Test-Path "grammardb.sqlite3") -and -not (Test-Path "src-tauri/resources/grammardb.sqlite3")) {
            Copy-Item "grammardb.sqlite3" "src-tauri/resources/"
          }
          if ((Test-Path "verbum_offline.sqlite3") -and -not (Test-Path "src-tauri/resources/verbum_offline.sqlite3")) {
            Copy-Item "verbum_offline.sqlite3" "src-tauri/resources/"
          }
          
          $global:LASTEXITCODE = 0
          Write-Host "Prepared resources folder contents:"
          Get-ChildItem src-tauri/resources/

      - name: Build Desktop NSIS Installer
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Locate and Stage Windows Installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*setup.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Could not find NSIS setup installer under src-tauri/target!"
            exit 1
          }
          Write-Host "Successfully built: $($installer.FullName) ($($installer.Length) bytes)"
          New-Item -ItemType Directory -Force -Path "release_artifacts"
          Copy-Item $installer.FullName "release_artifacts/SUBaka_1.0.0_x64-setup.exe"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUBaka_1.0.0_x64-setup
          path: release_artifacts/SUBaka_1.0.0_x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: 'SUBaka v1.0.0 (Windows x64)'
          files: release_artifacts/SUBaka_1.0.0_x64-setup.exe
          body: |
            ## Рэліз SUBaka для Windows x64 (Галоўны самадастатковы ўсталёўшчык)

            - **`SUBaka_1.0.0_x64-setup.exe`** — адзіны галоўны аўтаномны ўсталёўшчык для Windows (x64).
            - Уключае ўбудаваны FFmpeg sidecar і базу слоўнікаў у тэчцы `resources/`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
