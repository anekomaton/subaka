name: Release SUBaka Desktop (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Download FFmpeg sidecar (Windows x64)
        shell: pwsh
        run: |
          $binDir = Join-Path (Get-Location) "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $target = Join-Path $binDir "ffmpeg-x86_64-pc-windows-msvc.exe"
          $copyTarget = Join-Path $binDir "ffmpeg.exe"

          $urls = @(
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64",
            "https://raw.githubusercontent.com/eugeneware/ffmpeg-static/b6.1.1/ffmpeg-win32-x64"
          )

          if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 5000000) {
            Write-Host "Downloading FFmpeg sidecar for Windows..."
            foreach ($u in $urls) {
              Write-Host "Attempting download from $u..."
              try {
                & curl.exe -s -S -f -L --retry 5 --retry-delay 2 -H "User-Agent: Mozilla/5.0" $u -o $target
              } catch {
                Write-Host "curl.exe error: $_"
              }
              if ((Test-Path $target) -and (Get-Item $target).Length -gt 5000000) {
                break
              }
              try {
                [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                Invoke-WebRequest -Uri $u -OutFile $target -UserAgent "Mozilla/5.0" -TimeoutSec 120
              } catch {
                Write-Host "Invoke-WebRequest error: $_"
              }
              if ((Test-Path $target) -and (Get-Item $target).Length -gt 5000000) {
                break
              }
            }
          }
          if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 5000000) {
            Write-Error "Failed to acquire valid FFmpeg sidecar binary!"
            exit 1
          }
          $item = Get-Item $target
          Write-Host "FFmpeg sidecar ready: $($item.FullName) ($($item.Length) bytes)"
          Copy-Item $target $copyTarget -Force

      - name: Build Frontend for Desktop
        run: npm run build:client

      - name: Build Offline Dictionaries & GrammarDB into Resources
        shell: pwsh
        run: |
          $resDir = Join-Path (Get-Location) "src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $resDir | Out-Null
          Set-Content -Path (Join-Path $resDir ".gitkeep") -Value "# keep"

          # 1. Build Verbum Offline Dictionaries (TSBLM, Klyshka, RBS, ESBM)
          $verbumTarget = Join-Path $resDir "verbum_offline.sqlite3"
          if (-not (Test-Path $verbumTarget) -or (Get-Item $verbumTarget).Length -lt 10000000) {
            Write-Host "Building offline Verbum dictionaries (TSBLM, Klyshka, RBS, ESBM) into resources..."
            try {
              python scripts/build-verbum-db.py $verbumTarget
            } catch {
              Write-Host "Warning: build-verbum-db.py caught error: $_"
            }
          }

          # 2. Build GrammarDB from Official Belarus/GrammarDB Release
          $grammarTarget = Join-Path $resDir "grammardb.sqlite3"
          if (-not (Test-Path $grammarTarget) -or (Get-Item $grammarTarget).Length -lt 10000000) {
            Write-Host "Building offline GrammarDB (2M+ word forms) into resources..."
            try {
              python server/buildGrammarDbFromRelease.py $grammarTarget
            } catch {
              Write-Host "Warning: buildGrammarDbFromRelease.py caught error: $_"
            }
          }

          Write-Host "Prepared resources folder contents:"
          Get-ChildItem $resDir | ForEach-Object {
            Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Build Desktop NSIS Installer
        run: npx tauri build --ci --no-sign --ignore-version-mismatches --verbose

      - name: Locate and Stage Windows Installer
        shell: pwsh
        run: |
          Write-Host "Searching for built installers under src-tauri/target..."
          $allExes = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $allExes) {
            Write-Host "Found binary: $($f.FullName) ($($f.Length) bytes)"
          }

          # 1. Look for installer inside bundle/nsis
          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "bundle[\\/]nsis" -and $_.Extension -eq ".exe" } |
            Select-Object -First 1

          # 2. Look for any setup executable
          if (-not $installer) {
            $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*setup*.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          # 3. Look for any .exe inside bundle directory
          if (-not $installer) {
            $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "bundle" -and $_.Extension -eq ".exe" } |
              Select-Object -First 1
          }

          # 4. Fallback to release binary if bundling had issues
          if (-not $installer) {
            $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "release" -and $_.Name -like "*subaka*.exe" -and $_.Name -notmatch "build_script" } |
              Select-Object -First 1
          }

          if (-not $installer) {
            Write-Error "Could not find built installer under src-tauri/target! Showing directory tree:"
            Get-ChildItem -Path "src-tauri/target" -Recurse -Depth 3 | Select-Object FullName
            exit 1
          }

          Write-Host "Staging installer: $($installer.FullName) ($($installer.Length) bytes)"
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null
          Copy-Item $installer.FullName "release_artifacts/SUBaka_1.0.0_x64-setup.exe" -Force
          $staged = Get-Item "release_artifacts/SUBaka_1.0.0_x64-setup.exe"
          Write-Host "Installer staged: $($staged.FullName) ($($staged.Length) bytes)"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUBaka_1.0.0_x64-setup
          path: release_artifacts/SUBaka_1.0.0_x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: 'SUBaka v1.0.0 (Windows x64)'
          files: release_artifacts/SUBaka_1.0.0_x64-setup.exe
          fail_on_unmatched_files: false
          body: |
            ## Рэліз SUBaka для Windows x64 (інсталятар)

            - **`SUBaka_1.0.0_x64-setup.exe`** — аўтаномны інсталятар для Windows (x64).
            - Уключае ўбудаваны FFmpeg sidecar і гатовыя афлайн-базы (`verbum_offline.sqlite3` і `grammardb.sqlite3` на 2+ млн словаформаў) у каталогу `resources/`.
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
