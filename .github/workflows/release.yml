name: SUBaka Desktop (Windows x64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.edition == 'lite' && 'Lite' || 'Full' }} Installer
    runs-on: windows-latest
    strategy:
      matrix:
        edition: [lite, full]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm install

      - name: Sync version across project files
        run: node scripts/sync-version.js

      - name: Download FFmpeg sidecar (Windows x64)
        shell: pwsh
        run: |
          $binDir = Join-Path (Get-Location) "src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          $target = Join-Path $binDir "ffmpeg-x86_64-pc-windows-msvc.exe"
          $copyTarget = Join-Path $binDir "ffmpeg.exe"

          $urls = @(
            "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64",
            "https://raw.githubusercontent.com/eugeneware/ffmpeg-static/b6.1.1/ffmpeg-win32-x64"
          )

          if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 5000000) {
            Write-Host "Downloading FFmpeg sidecar for Windows..."
            foreach ($u in $urls) {
              Write-Host "Attempting download from $u..."
              try {
                & curl.exe -s -S -f -L --retry 5 --retry-delay 2 -H "User-Agent: Mozilla/5.0" $u -o $target
              } catch {
                Write-Host "curl.exe error: $_"
              }
              if ((Test-Path $target) -and (Get-Item $target).Length -gt 5000000) {
                break
              }
              try {
                [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                Invoke-WebRequest -Uri $u -OutFile $target -UserAgent "Mozilla/5.0" -TimeoutSec 120
              } catch {
                Write-Host "Invoke-WebRequest error: $_"
              }
              if ((Test-Path $target) -and (Get-Item $target).Length -gt 5000000) {
                break
              }
            }
          }
          if (-not (Test-Path $target) -or (Get-Item $target).Length -lt 5000000) {
            Write-Error "Failed to acquire valid FFmpeg sidecar binary!"
            exit 1
          }
          $item = Get-Item $target
          Write-Host "FFmpeg sidecar ready: $($item.FullName) ($($item.Length) bytes)"
          Copy-Item $target $copyTarget -Force

      - name: Build Frontend for Desktop
        run: npm run build:client

      - name: Build Offline Dictionaries & Resources
        shell: pwsh
        run: |
          $resDir = Join-Path (Get-Location) "src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $resDir | Out-Null
          Set-Content -Path (Join-Path $resDir ".gitkeep") -Value "# keep"

          # 1. Build Verbum Offline Dictionaries (TSBLM, Klyshka, RBS, ESBM)
          $verbumTarget = Join-Path $resDir "verbum_offline.sqlite3"
          if (-not (Test-Path $verbumTarget) -or (Get-Item $verbumTarget).Length -lt 10000000) {
            Write-Host "Building offline Verbum dictionaries (TSBLM, Klyshka, RBS, ESBM)..."
            try {
              python scripts/build-verbum-db.py $verbumTarget
            } catch {
              Write-Host "Warning: build-verbum-db.py error: $_"
            }
          }

          # 2. Build GrammarDB from Official Belarus/GrammarDB Release
          $grammarTarget = Join-Path $resDir "grammardb.sqlite3"
          if (-not (Test-Path $grammarTarget) -or (Get-Item $grammarTarget).Length -lt 10000000) {
            Write-Host "Building offline GrammarDB (2M+ word forms)..."
            try {
              python server/buildGrammarDbFromRelease.py $grammarTarget
            } catch {
              Write-Host "Warning: buildGrammarDbFromRelease.py error: $_"
            }
          }

          # 3. Whisper Components: Full vs Lite
          if ("${{ matrix.edition }}" -eq "full") {
            Write-Host "=== FULL EDITION: Preparing complete Whisper offline binaries, CUDA and GGML model ==="
            $whisperScript = Join-Path (Get-Location) "src-tauri/binaries/download_whisper_sidecars.ps1"
            if (Test-Path $whisperScript) {
              & pwsh -ExecutionPolicy Bypass -File $whisperScript
            } else {
              Write-Error "Script download_whisper_sidecars.ps1 not found!"
              exit 1
            }
          } else {
            Write-Host "=== LITE EDITION: Skipping pre-bundled Whisper model and CUDA to minimize package size ==="
            # In Lite edition, do not bundle ggml-small.bin or CUDA binaries into installer resources.
            # Only keep empty placeholder or lightweight whisper CPU if needed; model will download on demand.
          }

          Write-Host "Prepared resources folder contents (${{ matrix.edition }}):"
          Get-ChildItem $resDir | ForEach-Object {
            Write-Host "  $($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Cache NSIS and Tauri Bundler Dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: ${{ runner.os }}-tauri-nsis-3.11-v1

      - name: Pre-populate NSIS 3.11 and Plugins for Tauri Bundler
        shell: pwsh
        run: |
          $localAppData = $env:LOCALAPPDATA
          if (-not $localAppData) {
            $localAppData = Join-Path $env:USERPROFILE "AppData\Local"
          }
          $nsisBase = Join-Path $localAppData "tauri\NSIS"
          $nsis311Dir = Join-Path $nsisBase "nsis-3.11"
          $makensisExe = Join-Path $nsis311Dir "makensis.exe"
          $pluginsDir = Join-Path $nsis311Dir "Plugins\x86-unicode"
          $additionalDir = Join-Path $pluginsDir "additional"
          $tauriUtilsDll = Join-Path $additionalDir "nsis_tauri_utils.dll"

          New-Item -ItemType Directory -Force -Path $additionalDir | Out-Null

          # 1. Ensure nsis-3.11 is present and makensis.exe exists
          if (-not (Test-Path $makensisExe)) {
            Write-Host "makensis.exe not found in cache. Downloading NSIS 3.11 with robust retry..."
            $zipPath = Join-Path $nsisBase "nsis-3.11.zip"
            $urls = @(
              "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip",
              "https://sourceforge.net/projects/nsis/files/NSIS%203/3.11/nsis-3.11.zip/download"
            )
            $downloaded = $false
            foreach ($url in $urls) {
              Write-Host "Attempting download from: $url"
              try {
                & curl.exe -s -S -f -L --retry 10 --retry-all-errors --retry-delay 3 -H "User-Agent: Mozilla/5.0" $url -o $zipPath
                if ((Test-Path $zipPath) -and (Get-Item $zipPath).Length -gt 1000000) {
                  $downloaded = $true
                  break
                }
              } catch {
                Write-Host "Download attempt failed: $_"
              }
            }
            if (-not $downloaded -or -not (Test-Path $zipPath)) {
              Write-Error "Failed to download nsis-3.11.zip from all sources!"
              exit 1
            }
            Write-Host "Extracting nsis-3.11.zip into $nsisBase..."
            Expand-Archive -Path $zipPath -DestinationPath $nsisBase -Force
            Remove-Item $zipPath -Force -ErrorAction SilentlyContinue
          }

          # 2. Ensure nsis_tauri_utils.dll is present
          if (-not (Test-Path $tauriUtilsDll) -or (Get-Item $tauriUtilsDll).Length -lt 20000) {
            Write-Host "Downloading nsis_tauri_utils.dll with retry..."
            $dllUrl = "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll"
            try {
              & curl.exe -s -S -f -L --retry 10 --retry-all-errors --retry-delay 3 -H "User-Agent: Mozilla/5.0" $dllUrl -o $tauriUtilsDll
            } catch {
              Write-Host "Warning downloading nsis_tauri_utils.dll: $_"
            }
          }
          if (Test-Path $tauriUtilsDll) {
            Copy-Item $tauriUtilsDll (Join-Path $pluginsDir "nsis_tauri_utils.dll") -Force -ErrorAction SilentlyContinue
          }

          # 3. Add NSIS directory to PATH
          Write-Host "Adding $nsis311Dir to PATH..."
          $env:PATH = "$nsis311Dir;" + $env:PATH
          Add-Content -Path $env:GITHUB_PATH -Value $nsis311Dir

          Write-Host "NSIS verification status:"
          if (Test-Path $makensisExe) {
            Write-Host "  makensis.exe: OK ($(Get-Item $makensisExe).FullName)"
            & $makensisExe /VERSION
          } else {
            Write-Error "makensis.exe still missing after setup!"
            exit 1
          }
          if (Test-Path $tauriUtilsDll) {
            Write-Host "  nsis_tauri_utils.dll: OK ($(Get-Item $tauriUtilsDll).FullName)"
          }

      - name: Build Desktop NSIS Installer
        run: npx tauri build --ci --no-sign --ignore-version-mismatches --verbose

      - name: Locate and Stage Windows Installer
        shell: pwsh
        run: |
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Staging installer for version $pkgVersion (${{ matrix.edition }})..."
          
          $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "bundle[\\/]nsis" -and $_.Extension -eq ".exe" } |
            Select-Object -First 1

          if (-not $installer) {
            $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*setup*.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }

          if (-not $installer) {
            $installer = Get-ChildItem -Path "src-tauri/target" -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match "release" -and $_.Name -like "*subaka*.exe" -and $_.Name -notmatch "build_script" } |
              Select-Object -First 1
          }

          if (-not $installer) {
            Write-Error "Could not find built installer under src-tauri/target!"
            exit 1
          }

          $editionName = "${{ matrix.edition }}"
          $destFileName = "SUBaka_${pkgVersion}_x64-${editionName}_setup.exe"
          New-Item -ItemType Directory -Force -Path "release_artifacts" | Out-Null
          $destPath = Join-Path "release_artifacts" $destFileName

          Copy-Item $installer.FullName $destPath -Force
          $staged = Get-Item $destPath
          Write-Host "Installer staged successfully: $($staged.FullName) ($($staged.Length) bytes)"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SUBaka_x64_${{ matrix.edition }}_setup
          path: release_artifacts/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
          merge-multiple: true

      - name: Inspect downloaded binaries
        run: |
          mkdir -p release_artifacts
          cp downloaded_artifacts/*.exe release_artifacts/ || true
          ls -lh release_artifacts/

      - name: Determine Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.get_version.outputs.VERSION) }}
          name: ${{ format('SUBaka v{0} (Windows x64)', steps.get_version.outputs.VERSION) }}
          files: release_artifacts/SUBaka_*_x64-*_setup.exe
          fail_on_unmatched_files: false
          body: |
            ## Праграма SUBaka пад Windows 10/11 (x64)

            Даступныя два варыянты інсталятара:

            - **`SUBaka_${{ steps.get_version.outputs.VERSION }}_x64-full_setup.exe`** - поўная аўтаномная версія «ўсё ў адным» з Whisper і падтрымкай NVIDIA CUDA.
            - **`SUBaka_${{ steps.get_version.outputs.VERSION }}_x64-lite_setup.exe`** - палегчаная версія (праграма + FFmpeg + слоўнікі Verbum і GrammarDB). Падчас усталёўкі даступны выбар (птушачка) для спампоўкі мадэлі Whisper і паскарэння NVIDIA CUDA (~650 МБ), альбо іх можна спампаваць у любы момант непасрэдна ў праграме.

          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
